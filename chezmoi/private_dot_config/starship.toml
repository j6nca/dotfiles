# ~/.config/starship.toml

# Define prompt segment layout using powerline symbols
format = """
[░▒▓](bg:#3B4252 fg:#4C566A)\
$username\
[](bg:#434C5E fg:#3B4252)\
$directory\
[](fg:#434C5E bg:#434C5E)\
[](bg:#81A1C1 fg:#434C5E)\
$git_branch\
$git_status\
[](bg:#88C0D0 fg:#81A1C1)\
$golang\
$nodejs\
$docker_context\
[](fg:#88C0D0 bg:#D8DEE9)\
$cmd_duration\
[](fg:#D8DEE9)\
\n$character"""

# Don't create a new line after prompt
add_newline = false

[username]
show_always = true
style_user = "bg:#3B4252 fg:#ECEFF4"
style_root = "bg:#3B4252 fg:#BF616A"
format = '[ $user ]($style)'

[directory]
style = "bg:#434C5E fg:#E5E9F0"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
symbol = " "
style = "bg:#81A1C1 fg:#2E3440"
format = '[ $symbol$branch ]($style)'

[git_status]
style = "bg:#81A1C1 fg:#2E3440"
format = '[$all_status$ahead_behind ]($style)'

[golang]
symbol = " "
style = "bg:#88C0D0 fg:#2E3440"
format = '[ $symbol($version) ]($style)'

[nodejs]
symbol = " "
style = "bg:#88C0D0 fg:#2E3440"
format = '[ $symbol($version) ]($style)'

[docker_context]
symbol = " "
style = "bg:#88C0D0 fg:#2E3440"
format = '[ $symbol$context ]($style)'

[cmd_duration]
style = "bg:#D8DEE9 fg:#2E3440"
format = '[ 󰔛 $duration ]($style)'

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
