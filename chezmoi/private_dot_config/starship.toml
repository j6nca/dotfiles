# ~/.config/starship.toml

# Define prompt segment layout using powerline symbols
format = """
[░▒▓](bg:#0087AF fg:#005F87)\
$username\
[](bg:#0087AF fg:#005F87)\
$directory\
[](bg:#326CE5 fg:#0087AF)\
$kubernetes\
[](bg:#5F8700 fg:#326CE5)\
$git_branch\
$git_status\
[](bg:#875F00 fg:#5F8700)\
$golang\
$nodejs\
$docker_context\
[](fg:#875F00 bg:#3A3A3A)\
$cmd_duration\
[](fg:#3A3A3A)\
\n$character"""

# Don't create a new line after prompt
add_newline = false

[username]
show_always = true
style_user = "bg:#005F87 fg:#E4E4E4"
style_root = "bg:#AF0000 fg:#E4E4E4"
format = '[ $user ]($style)'

[directory]
style = "bg:#0087AF fg:#E4E4E4"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

# Kubernetes Blue (#326CE5) - Only displays current cluster/context
[kubernetes]
disabled = false
symbol = "☸ "
style = "bg:#326CE5 fg:#E4E4E4"
format = '[ $symbol$context ]($style)'

[git_branch]
symbol = " "
style = "bg:#5F8700 fg:#E4E4E4"
format = '[ $symbol$branch ]($style)'

[git_status]
style = "bg:#5F8700 fg:#E4E4E4"
ahead = '[⇡${count}](bg:#D78700 fg:#E4E4E4)'
behind = '[⇣${count}](bg:#D78700 fg:#E4E4E4)'
diverged = '[⇕⇡${ahead_count}⇣${behind_count}](bg:#D78700 fg:#E4E4E4)'
untracked = '[?](bg:#D78700 fg:#E4E4E4)'
stashed = '[$](bg:#D78700 fg:#E4E4E4)'
modified = '[!](bg:#D78700 fg:#E4E4E4)'
staged = '[+](bg:#D78700 fg:#E4E4E4)'
renamed = '[»](bg:#D78700 fg:#E4E4E4)'
deleted = '[✘](bg:#D78700 fg:#E4E4E4)'
format = '[$all_status$ahead_behind]($style)'

[golang]
symbol = " "
style = "bg:#875F00 fg:#E4E4E4"
format = '[ $symbol($version) ]($style)'

[nodejs]
symbol = " "
style = "bg:#875F00 fg:#E4E4E4"
format = '[ $symbol($version) ]($style)'

[docker_context]
symbol = " "
style = "bg:#875F00 fg:#E4E4E4"
format = '[ $symbol$context ]($style)'

[cmd_duration]
style = "bg:#3A3A3A fg:#E4E4E4"
format = '[ 󰔛 $duration ]($style)'

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
